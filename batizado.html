    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="style.css">
    <style>
        /* Desabilitar zoom completamente */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            touch-action: pan-x pan-y;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -ms-touch-action: pan-x pan-y;
        }

        /* Estilos específicos para a galeria */
        .batizado-section {
            min-height: 100vh;
            padding: var(--spacing-2xl) 0;
            background: linear-gradient(135deg, rgba(0, 168, 255, 0.05) 0%, rgba(255, 215, 0, 0.05) 100%);
        }

        .batizado-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
            animation: fadeInDown 0.8s ease-in-out;
        }

        .batizado-header h1 {
            font-size: 3rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--spacing-md);
        }

        .batizado-header p {
            font-size: 1.1rem;
            color: var(--color-text-muted);
            max-width: 600px;
            margin: 0 auto var(--spacing-xl);
        }

        /* Galeria em Grid */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-2xl);
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            animation: fadeIn 0.5s ease-in-out;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            background: var(--color-bg-secondary);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
            -webkit-user-select: none;
            user-select: none;
            transition: opacity var(--transition-base);
        }

        .gallery-item:hover img {
            opacity: 0.9;
        }

        .gallery-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 168, 255, 0.2);
            opacity: 0;
            transition: opacity var(--transition-base);
            z-index: 5;
        }

        .gallery-item:hover::before {
            opacity: 1;
        }

        .gallery-item::after {
            content: '🔍';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            opacity: 0;
            transition: opacity var(--transition-base);
            z-index: 10;
        }

        .gallery-item:hover::after {
            opacity: 1;
        }

        /* Lightbox Modal */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            animation: fadeIn 0.3s ease-in-out;
        }

        .lightbox.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lightbox-image {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all var(--transition-base);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-close:hover {
            color: var(--color-yellow);
            transform: scale(1.2);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            padding: 15px 20px;
            user-select: none;
            transition: all var(--transition-base);
            background: rgba(0, 168, 255, 0.3);
            border-radius: 5px;
        }

        .lightbox-nav:hover {
            background: rgba(0, 168, 255, 0.7);
        }

        .lightbox-prev {
            left: 20px;
        }

        .lightbox-next {
            right: 20px;
        }

        .lightbox-counter {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 1rem;
            white-space: nowrap;
        }

        /* Filtro de fotos */
        .gallery-filter {
            display: flex;
            justify-content: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-2xl);
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: var(--spacing-sm) var(--spacing-lg);
            border: 2px solid var(--color-blue);
            background: transparent;
            color: var(--color-text-light);
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all var(--transition-base);
            font-size: 0.95rem;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--gradient-primary);
            color: var(--color-bg-dark);
            border-color: transparent;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .batizado-header h1 {
                font-size: 2rem;
            }

            .gallery-container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: var(--spacing-sm);
            }

            .lightbox-nav {
                font-size: 1.5rem;
                padding: 10px 15px;
            }

            .lightbox-close {
                top: -35px;
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            .gallery-container {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }

            .batizado-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>

        // Carregar galeria
        function loadGallery(itemsToShow) {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            itemsToShow.forEach((img, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `<img src="${img}" alt="Foto ${index + 1}" loading="lazy">`;
                item.onclick = () => openLightbox(index, itemsToShow);
                gallery.appendChild(item);
            });

            // Atualizar contador total
            document.getElementById('totalImages').textContent = itemsToShow.length;
        }

        // Abrir lightbox
        function openLightbox(index, itemsToShow) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImage = document.getElementById('lightboxImage');
            
            currentLightboxIndex = index;
            filteredImages = itemsToShow;
            
            lightboxImage.src = itemsToShow[index];
            document.getElementById('currentImage').textContent = index + 1;
            document.getElementById('totalImages').textContent = itemsToShow.length;
            
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Fechar lightbox
        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Navegar entre imagens no lightbox
        function changeLightboxImage(direction) {
            let newIndex = currentLightboxIndex + direction;
            
            if (newIndex >= filteredImages.length) {
                newIndex = 0;
            } else if (newIndex < 0) {
                newIndex = filteredImages.length - 1;
            }
            
            currentLightboxIndex = newIndex;
            const lightboxImage = document.getElementById('lightboxImage');
            lightboxImage.src = filteredImages[newIndex];
            document.getElementById('currentImage').textContent = newIndex + 1;
        }

        // Configurar filtros
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                const filter = this.dataset.filter;
                let itemsToShow = [];

                if (filter === 'all') {
                    itemsToShow = [...images, ...videos];
                } else if (filter === 'jpg') {
                    itemsToShow = [...images];
                } else if (filter === 'mp4') {
                    itemsToShow = [...videos];
                }

                loadGallery(itemsToShow);
            });
        });

        // Fechar lightbox ao clicar fora
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });

        // Navegar com teclado
        document.addEventListener('keydown', function(e) {
            const lightbox = document.getElementById('lightbox');
            if (lightbox.classList.contains('active')) {
                if (e.key === 'ArrowLeft') changeLightboxImage(-1);
                if (e.key === 'ArrowRight') changeLightboxImage(1);
                if (e.key === 'Escape') closeLightbox();
            }
        });

        // Carregar galeria ao inicializar
        loadGallery([...images, ...videos]);
    </script>
</body>
</html>
